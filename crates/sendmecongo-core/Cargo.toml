[package]
name = "sendmecongo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SMQ1 optical transfer codec: container, frame, RaptorQ fountain coding, QR rendering"

[dependencies]
brotli = "8"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = "0.25"
# Screen player (desktop only). Optional so headless targets can link the codec
# without dragging a windowing stack in: minifb's wayland path does not compile
# on Android. Desktop crates get it via the default `play` feature.
minifb = { version = "0.27", optional = true }
qrcode = "0.14"
raptorq = "2.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = ["play"]
play = ["dep:minifb"]
